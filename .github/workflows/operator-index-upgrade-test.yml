name: "Operator Index Upgrade Test"

on:
  workflow_dispatch:
    inputs:
      operator-index-image:
        description: 'ACS Operator index image (e.g., quay.io/rhacs-eng/stackrox-operator-index:ocp-v4-22-...)'
        required: true
        type: string
      version-stream:
        description: 'ACS version stream under test (e.g. 4.10). Determines channel and Y-2 oldest.'
        required: true
        type: string
      ocp-version:
        description: 'OCP version for the infra cluster (e.g. 4.22)'
        required: true
        type: string
      cluster-lifespan:
        description: 'Cluster lifespan (e.g., 2h, 4h, 8h)'
        required: false
        default: '2h'
        type: string
  workflow_call:
    inputs:
      operator-index-image:
        description: 'ACS Operator index image'
        required: true
        type: string
      version-stream:
        description: 'ACS minor version under test (e.g. 4.10). Determines channel and Y-2 oldest.'
        required: true
        type: string
      ocp-version:
        description: 'OCP version for the infra cluster (e.g. 4.22)'
        required: true
        type: string
      cluster-lifespan:
        description: 'Cluster lifespan (e.g., 2h, 4h, 8h)'
        required: false
        default: '2h'
        type: string
    secrets:
      INFRA_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

run-name: >-
  ${{ format('Operator Index Upgrade Test v{0}', inputs.version-stream) }}

jobs:
  create-cluster:
    name: Create OpenShift cluster
    runs-on: ubuntu-latest
    outputs:
      cluster-name: ${{ steps.cluster-name.outputs.name }}
    steps:
      - name: Generate cluster name
        id: cluster-name
        env:
          VERSION: ${{ inputs.version-stream }}
          OCP: ${{ inputs.ocp-version }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Remove dots from version strings for cluster name (max 28 chars, must match ^[a-z][a-z0-9-]{1,26}[a-z0-9]$)
          VERSION_NO_DOTS=$(echo "$VERSION" | tr -d '.')
          OCP_NO_DOTS=$(echo "$OCP" | tr -d '.')
          # Use PR number if available (e.g., pr493), otherwise use run attempt
          if [[ -n "$PR_NUMBER" ]]; then
            SUFFIX="pr${PR_NUMBER}"
          else
            SUFFIX="r${RUN_ATTEMPT}"
          fi
          # Format: upg-v410-ocp412-pr493 (typically <25 chars)
          CLUSTER_NAME="upg-v${VERSION_NO_DOTS}-ocp${OCP_NO_DOTS}-${SUFFIX}"
          echo "name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "Generated cluster name: $CLUSTER_NAME (length: ${#CLUSTER_NAME})"
      - name: Set cluster args
        id: ocp
        env:
          OCP_VERSION: ${{ inputs.ocp-version }}
        run: |
          echo "infra-args=openshift-version=ocp/candidate-${OCP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create OpenShift cluster
        uses: stackrox/actions/infra/create-cluster@v1
        with:
          token: ${{ secrets.INFRA_TOKEN }}
          flavor: openshift-4
          name: ${{ steps.cluster-name.outputs.name }}
          lifespan: ${{ inputs.cluster-lifespan }}
          wait: true
          args: ${{ steps.ocp.outputs.infra-args }}

  run-upgrade-tests:
    name: Run operator-index upgrade tests
    needs: create-cluster
    runs-on: ubuntu-latest
    container:
      image: quay.io/stackrox-io/apollo-ci:stackrox-test-stable
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install infractl
        uses: stackrox/actions/infra/install-infractl@v1

      - name: Download cluster kubeconfig
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
          CLUSTER_NAME: ${{ needs.create-cluster.outputs.cluster-name }}
        run: |
          infractl artifacts --download-dir=./artifacts "$CLUSTER_NAME"
          echo "KUBECONFIG=${GITHUB_WORKSPACE}/artifacts/kubeconfig" >> "$GITHUB_ENV"

      - name: "Test 1: upgrade oldest-supported → provided"
        env:
          OPERATOR_INDEX_IMAGE: ${{ inputs.operator-index-image }}
          VERSION_STREAM: ${{ inputs.version-stream }}
        run: make upgrade-test-oldest

      - name: "Test 2: install provided → optionally upgrade to latest GA"
        env:
          OPERATOR_INDEX_IMAGE: ${{ inputs.operator-index-image }}
          VERSION_STREAM: ${{ inputs.version-stream }}
        run: make upgrade-test-latest

  delete-test-cluster:
    name: Delete infra test cluster
    needs: [create-cluster, run-upgrade-tests]
    runs-on: ubuntu-latest
    if: always() && needs.create-cluster.result != 'cancelled'
    env:
      INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
      CLUSTER_NAME: ${{ needs.create-cluster.outputs.cluster-name }}
    steps:
      - name: Install infractl
        uses: stackrox/actions/infra/install-infractl@v1

      - name: Delete cluster
        run: infractl delete "${CLUSTER_NAME}"

  report-status:
    name: Report test status
    needs: [create-cluster, run-upgrade-tests, delete-test-cluster]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Operator Index Upgrade Test Results

          | Field | Value |
          |-------|-------|
          | **Operator image** | `${{ inputs.operator-index-image }}` |
          | **ACS version** | `${{ inputs.version-stream }}` |
          | **Upgrade tests** | ${{ needs.run-upgrade-tests.result }} |

          ## Tests run:
          1. **Test 1** — install oldest supported ACS version, upgrade to the provided operator-index image
          2. **Test 2** — install provided operator-index image, upgrade to latest GA if provided ACS version is behind
          EOF
