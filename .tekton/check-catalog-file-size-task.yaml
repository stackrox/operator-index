apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-catalog-file-size
  namespace: rh-acs-tenant
spec:
  description: Checks the file size of the File Based Catalog files to ensure they are within acceptable limits.
  params:
  - name: SOURCE_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with
      the application source code. This should be the result of the git-clone task,
      results from other tasks might fail as dirty.
    type: string
  - name: CATALOG_OLD_FORMAT_MAX_SIZE_MB
    description: Maximum allowed file size in megabytes for catalog-bundle-object/rhacs-operator/catalog.json
    type: string
    default: "135"
  - name: CATALOG_NEW_FORMAT_MAX_SIZE_MB
    description: Maximum allowed file size in megabytes for catalog-csv-metadata/rhacs-operator/catalog.json
    type: string
    default: "28"
  volumes:
  - name: workdir
    emptyDir: { }
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  steps:
  - name: use-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
  - name: check-catalog-file-size
    image: registry.redhat.io/ubi9/go-toolset@sha256:e8938564f866174a6d79e55dfe577c2ed184b1f53e91d782173fb69b07ce69ef
    workingDir: /var/workdir/source
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      echo "Checking File Based Catalog file sizes..."

      max_old_format_size_mb=$(params.CATALOG_OLD_FORMAT_MAX_SIZE_MB)
      max_new_format_size_mb=$(params.CATALOG_NEW_FORMAT_MAX_SIZE_MB)

      old_format_file="catalog-bundle-object/rhacs-operator/catalog.json"
      new_format_file="catalog-csv-metadata/rhacs-operator/catalog.json"
      for catalog_file in "$old_format_file" "$new_format_file"; do
        if [[ ! -f "$catalog_file" ]]; then
          echo >&2 "ERROR: File $catalog_file not found"
          exit 1
        fi
      done

      old_format_file_size_mb=$(stat -c %s "$old_format_file" | numfmt --to-unit=1M --suffix=MB)
      new_format_file_size_mb=$(stat -c %s "$new_format_file" | numfmt --to-unit=1M --suffix=MB)

      if [[ $old_format_file_size_mb -gt $max_old_format_size_mb ]]; then
        echo >&2 "ERROR: File $old_format_file exceeds maximum size limit"
        echo >&2 "       File size: ${old_format_file_size_mb}MB, Maximum allowed: ${max_old_format_size_mb}MB"
        echo >&2 ""
        echo >&2 "Check what is the biggest old format catalog by running:"
        echo >&2 "       $ opm migrate registry.redhat.io/redhat/redhat-operator-index:v4.14 <tmp_dir>"
        echo >&2 "       $ find <tmp_dir> -name "catalog.json" -type f -exec du -h {} \; | sort -h | tail -5"
        echo >&2 "Adjust the CATALOG_OLD_FORMAT_MAX_SIZE_MB limit if ACS is not hte biggest one"
        exit 1
      fi
      
      if [[ $new_format_file_size_mb -gt $max_new_format_size_mb ]]; then
        echo >&2 "ERROR: File $new_format_file exceeds maximum size limit"
        echo >&2 "       File size: ${new_format_file_size_mb}MB, Maximum allowed: ${max_new_format_size_mb}MB"
        echo >&2 ""
        echo >&2 "Check what is the biggest new format catalog by running:"
        echo >&2 "       $ opm migrate registry.redhat.io/redhat/redhat-operator-index:v4.20 <tmp_dir>"
        echo >&2 "       $ find <tmp_dir> -name "catalog.json" -type f -exec du -h {} \; | sort -h | tail -5"
        echo >&2 "Adjust the CATALOG_NEW_FORMAT_MAX_SIZE_MB limit if ACS catalog is not hte biggest one"
        exit 1
      fi

      echo "All catalog files are within their size limits"
      echo "  old format catalog: size: ${old_format_file_size_mb}MB, max: ${max_old_format_size_mb}MB"
      echo "  new format catalog (csv compact): size: ${new_format_file_size_mb}MB, max: ${max_new_format_size_mb}MB"
