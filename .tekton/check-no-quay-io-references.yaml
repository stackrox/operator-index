apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-no-quay-io-references
  namespace: rh-acs-tenant
spec:
  description: This task is used to ensure that no quay.io references are present in the catalog files,
    as they are not allowed in the production environment.
  params:
  - name: SOURCE_ARTIFACT
    description: The Trusted Artifact URI pointing to the artifact with
      the application source code.
    type: string
  volumes:
  - name: workdir
    emptyDir: { }
  stepTemplate:
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  steps:
  - name: use-trusted-artifact
    image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
    args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
  - name: check-no-quay-io-references
    image: registry.access.redhat.com/ubi9:latest@sha256:304b50df1ea4db9706d8a30f4bbf26f582936ebc80c7e075c72ff2af99292a54
    workingDir: /var/workdir/source
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      time dnf -y upgrade --nobest
      time dnf -y install yq

      valid_bundle_image_repository="registry.redhat.io/advanced-cluster-security/rhacs-operator-bundle"

      if yq eval '.. | select(has("image")) | .image' catalog-template.yaml | grep -v "^$valid_bundle_image_repository"; then
        echo >&2 "catalog-template.yaml has image(s) not from $valid_bundle_image_repository repository. It is not allowed to merge such bundle images to master branch because it will no longer be releasable."
        exit 1
      fi
